# Raw decline-string templates per canonical cause (docs J.4, DATA_MODEL.md).
#
# Cause keys MUST exactly match backend.app.domain.types.Cause — the
# generator refuses to load this file otherwise (see
# data/generator.py::_validate_taxonomy). This file adds only the raw
# strings; disposition mapping stays single-sourced in domain/types.py.
#
# Each cause carries a representative mix of: casing chaos, truncation,
# issuer jargon, numeric-only codes, composites, and bilingual fragments —
# the shape categories the Phase-6 LLM normaliser must handle. UNKNOWN's
# templates are deliberately generic/uninformative: they are what a raw
# string that genuinely carries no signal looks like.

causes:
  INSUFFICIENT_FUNDS:
    - "INSUFFICIENT FUNDS"
    - "Insufficent Funds"
    - "insuff_bal"
    - "INSUFF FU"
    - "LOW BAL"
    - "DEBIT FAILED: BAL LOW"
    - "U16"
    - "TECH DECLINE - BAL LOW"
    - "insufficient balance / अपर्याप्त राशि"
    - "INSUFFICIENT-FUNDS-IN-ACCOUNT"

  LIMIT_EXCEEDED:
    - "LIMIT EXCEEDED"
    - "Limit Exceeded"
    - "TXN LIMIT XCD"
    - "DAILY LIMIT REACHED"
    - "LMT EXC"
    - "Z9"
    - "TECH DECLINE - LIMIT"
    - "amount limit se zyada"
    - "MAX AMOUNT EXCEEDED"

  MANDATE_REVOKED:
    - "MANDATE REVOKED"
    - "Mandate Revoked"
    - "REVOKED AT REMITTER"
    - "MNDT REV"
    - "ZM"
    - "TECH DECLINE - MANDATE NOT ACTIVE"
    - "mandate cancelled by customer"
    - "e-mandate रद्द"
    - "AUTOPAY REVOKED"

  MANDATE_PAUSED:
    - "MANDATE PAUSED"
    - "Mandate Paused"
    - "MNDT PAUSED BY CUST"
    - "TEMP HOLD ON MANDATE"
    - "PAUSED"
    - "AUTOPAY ON HOLD"
    - "mandate रोका गया"

  ACCOUNT_FROZEN:
    - "ACCOUNT FROZEN"
    - "Account Frozen"
    - "ACCT FRZN"
    - "A/C FREEZE - KYC PENDING"
    - "FROZEN DUE TO COMPLIANCE"
    - "खाता फ्रीज"

  ACCOUNT_CLOSED:
    - "ACCOUNT CLOSED"
    - "Account Closed"
    - "A/C CLOSED"
    - "NO SUCH ACCOUNT"
    - "ACCT DOES NOT EXIST"
    - "खाता बंद"

  AFA_REQUIRED:
    - "AFA REQUIRED"
    - "Additional Factor Auth Required"
    - "AFA NOT DONE"
    - "2FA REQUIRED"
    - "ADDL AUTH NEEDED"
    - "OTP VALIDATION REQUIRED"

  ISSUER_TECH_DECLINE:
    - "ISSUER TECH DECLINE"
    - "Issuer Technical Decline"
    - "BANK SERVER ERROR"
    - "ISSR DOWN"
    - "U26"
    - "TECH DECLINE - ISSUER"
    - "बैंक सर्वर एरर"

  PSP_TECH_DECLINE:
    - "PSP TECH DECLINE"
    - "PSP Technical Decline"
    - "APP SERVER ERROR"
    - "PSP DOWN"
    - "Z1"
    - "GATEWAY TIMEOUT AT PSP"

  TIMEOUT:
    - "TIMEOUT"
    - "Timed Out"
    - "TXN TIMEOUT"
    - "NO RESPONSE FROM BANK"
    - "RESP TIMEOUT"
    - "टाइमआउट"

  INVALID_MANDATE_STATE:
    - "INVALID MANDATE STATE"
    - "Invalid Mandate State"
    - "MNDT STATE INVALID"
    - "MANDATE NOT REGISTERED"
    - "BAD MANDATE REF"

  RISK_DECLINE:
    - "RISK DECLINE"
    - "Risk Declined"
    - "SUSPECTED FRAUD"
