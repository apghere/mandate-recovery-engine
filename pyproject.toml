[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandate-recovery-engine"
version = "0.1.0"
description = "Constrained retry-budget planner for Indian recurring-payment mandates"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
files = ["backend/app", "data", "simulator", "scripts"]
