name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mre
          POSTGRES_PASSWORD: mre
          POSTGRES_DB: mre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mre"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mre:mre@localhost:5432/mre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m scripts.migrate
      - run: ruff check .
      - run: mypy
      - run: pytest -q
